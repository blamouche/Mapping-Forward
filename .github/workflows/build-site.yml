name: Build site

# Regenerate the static site (docs/build_site.py -> docs/dist/), commit the
# output to main (for the mappingforward.fr rsync workflow) and deploy it to
# GitHub Pages.
#
# Triggers:
#   - schedule: once per day at 09:00 Europe/Paris. GitHub cron is UTC-only, so
#     we use a dual cron (07:00 UTC in summer/CEST, 08:00 UTC in winter/CET)
#     and a timezone guard that skips any run whose Paris hour is not 09.
#   - push: rebuild whenever articles (src/) or the generator change, so the
#     committed site stays fresh. The bot's own dist commits don't match these
#     paths, so this never re-triggers itself.
#   - workflow_dispatch: manual rebuild.

on:
  schedule:
    - cron: '0 7 * * *'   # 09:00 CEST (summer)
    - cron: '0 8 * * *'   # 09:00 CET (winter)
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/build_site.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Paris time (scheduled runs only)
        id: paris
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ='Europe/Paris' date +%H)
          echo "hour=$HOUR"
          echo "run=$([ "$HOUR" = "09" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build and commit site
        if: github.event_name != 'schedule' || steps.paris.outputs.run == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Bring in any remote commits first, then build from the latest src/.
          git checkout "$BRANCH"
          git pull --rebase origin "$BRANCH"
          python3 docs/build_site.py

          # Commit the generated site. dist/ is gitignored locally (keeps the
          # user's working copy clean); -f is needed to track it from CI.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build site: regenerate dist from articles"
          git push origin "$BRANCH"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.paris.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || steps.paris.outputs.run == 'true'
        uses: actions/deploy-pages@v4
