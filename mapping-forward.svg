<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      .title1 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 20px;
        fill: #1a88dd;
      }
      .title2 {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        font-size: 20px;
        fill: #ee9900;
      }

      .map-scroll {
        animation: map-move 10s linear infinite;
      }
      @keyframes map-move {
        from { transform: translateX(0); }
        to   { transform: translateX(-350px); }
      }

      .pin-a {
        animation: pin-bob 1.2s ease-in-out infinite alternate;
        transform-origin: 0px 0px;
      }
      .pin-b {
        animation: pin-bob 1.6s ease-in-out infinite alternate;
        transform-origin: 0px 0px;
        animation-delay: 0.3s;
      }
      .pin-c {
        animation: pin-bob 1.0s ease-in-out infinite alternate;
        transform-origin: 0px 0px;
        animation-delay: 0.7s;
      }
      @keyframes pin-bob {
        from { transform: translateY(0); }
        to   { transform: translateY(-7px); }
      }

      .pulse {
        animation: pulse-ring 2s ease-out infinite;
      }
      @keyframes pulse-ring {
        0%   { r: 6;  opacity: 0.8; }
        100% { r: 18; opacity: 0; }
      }

      .road-dash {
        animation: dash-anim 0.35s linear infinite;
      }
      @keyframes dash-anim {
        from { transform: translateX(0); }
        to   { transform: translateX(-24px); }
      }

      .title-group {
        animation: fadein 0.8s ease-out both;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .border-box {
        animation: border-pulse 3s ease-in-out infinite;
      }
      @keyframes border-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.5; }
      }
    </style>

    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#1a88dd" flood-opacity="0.7" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#ee9900" flood-opacity="0.7" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop-pin">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <clipPath id="map-clip">
      <rect x="0" y="0" width="700" height="200"/>
    </clipPath>

    <linearGradient id="fade-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->

  <!-- ===== SCROLLING MAP ===== -->
  <g clip-path="url(#map-clip)">
    <g class="map-scroll">

      <!-- Generate 3 tiles of 350px = 1050px total (viewport 700px, scroll 350px) -->

      <!-- MACRO: define one tile contents as a group, then repeat -->
      <!-- TILE A at x=0 -->
      <g transform="translate(0,0)">
        <!-- Base land -->
        <rect x="0" y="0" width="350" height="200" fill="#e8f4d0"/>
        <!-- Water patches -->
        <rect x="0"   y="130" width="55"  height="70"  fill="#b8ddf0"/>
        <rect x="290" y="110" width="60"  height="90"  fill="#b8ddf0"/>
        <!-- Darker green zones (forests) -->
        <rect x="30"  y="10"  width="90"  height="70"  fill="#c0d89e"/>
        <rect x="195" y="40"  width="80"  height="60"  fill="#c0d89e"/>
        <rect x="300" y="140" width="50"  height="40"  fill="#c0d89e"/>
        <!-- Sandy / desert patch -->
        <rect x="120" y="85"  width="80"  height="55"  fill="#f0dfa0"/>
        <rect x="55"  y="150" width="50"  height="35"  fill="#f0dfa0"/>

        <!-- Pixel grid -->
        <g stroke="#c0ccb0" stroke-width="1" opacity="0.6">
          <line x1="0"   y1="50"  x2="350" y2="50"/>
          <line x1="0"   y1="100" x2="350" y2="100"/>
          <line x1="0"   y1="150" x2="350" y2="150"/>
          <line x1="70"  y1="0"   x2="70"  y2="200"/>
          <line x1="140" y1="0"   x2="140" y2="200"/>
          <line x1="210" y1="0"   x2="210" y2="200"/>
          <line x1="280" y1="0"   x2="280" y2="200"/>
        </g>

        <!-- Contour lines -->
        <path d="M40,20 Q75,5 110,30 Q135,50 115,72 Q95,88 65,78 Q35,65 40,20Z"
              fill="none" stroke="#9dbf77" stroke-width="1.5" opacity="0.6"/>
        <path d="M200,45 Q238,25 268,55 Q288,80 260,100 Q232,115 207,96 Q185,76 200,45Z"
              fill="none" stroke="#9dbf77" stroke-width="1.5" opacity="0.6"/>

        <!-- Main road (horizontal yellow) -->
        <rect x="0" y="94" width="350" height="12" fill="#e8d060"/>
        <!-- Road border lines -->
        <line x1="0" y1="94"  x2="350" y2="94"  stroke="#cc9900" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="106" x2="350" y2="106" stroke="#cc9900" stroke-width="1.5" opacity="0.6"/>
        <!-- Dashes -->
        <g class="road-dash" fill="white" opacity="0.8">
          <rect x="0"   y="99" width="12" height="3"/>
          <rect x="24"  y="99" width="12" height="3"/>
          <rect x="48"  y="99" width="12" height="3"/>
          <rect x="72"  y="99" width="12" height="3"/>
          <rect x="96"  y="99" width="12" height="3"/>
          <rect x="120" y="99" width="12" height="3"/>
          <rect x="144" y="99" width="12" height="3"/>
          <rect x="168" y="99" width="12" height="3"/>
          <rect x="192" y="99" width="12" height="3"/>
          <rect x="216" y="99" width="12" height="3"/>
          <rect x="240" y="99" width="12" height="3"/>
          <rect x="264" y="99" width="12" height="3"/>
          <rect x="288" y="99" width="12" height="3"/>
          <rect x="312" y="99" width="12" height="3"/>
          <rect x="336" y="99" width="12" height="3"/>
          <rect x="360" y="99" width="12" height="3"/>
