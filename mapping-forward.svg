        <rect x="147" y="103" width="10" height="6"  fill="#8890a0"/>
        <rect x="179" y="102" width="12" height="6"  fill="#8890a0"/>

        <!-- Compass -->
        <g transform="translate(326, 26)" opacity="0.75">
          <polygon points="0,-13 -4,-4 0,-7 4,-4" fill="#cc2222"/>
          <polygon points="0,13 -4,4 0,7 4,4"   fill="#667788"/>
          <polygon points="13,0 4,-3 7,0 4,3"   fill="#667788"/>
          <polygon points="-13,0 -4,-3 -7,0 -4,3" fill="#667788"/>
          <circle cx="0" cy="0" r="3" fill="#334455"/>
        </g>

        <!-- PIN A (red) at x=168, y=58 -->
        <g class="pin-a" transform="translate(168, 58)">
          <circle class="pulse" cx="0" cy="0" r="6" fill="none" stroke="#ff3344" stroke-width="2"/>
          <rect x="-8" y="-24" width="16" height="16" rx="2" fill="#ff3344" filter="url(#drop-pin)"/>
          <rect x="-4" y="-20" width="8"  height="8"  fill="#ff8899"/>
          <polygon points="-5,0 5,0 0,9" fill="#ff3344"/>
        </g>

        <!-- PIN B (blue) at x=308, y=72 -->
        <g class="pin-b" transform="translate(308, 72)">
          <rect x="-8" y="-24" width="16" height="16" rx="2" fill="#1a88dd" filter="url(#drop-pin)"/>
          <rect x="-4" y="-20" width="8"  height="8"  fill="#88ccff"/>
          <polygon points="-5,0 5,0 0,9" fill="#1a88dd"/>
        </g>
      </g>

      <!-- TILE B at x=350 (identical) -->
