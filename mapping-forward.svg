        <rect x="120" y="85"  width="80"  height="55"  fill="#f0dfa0"/>
        <rect x="55"  y="150" width="50"  height="35"  fill="#f0dfa0"/>
        <g stroke="#c0ccb0" stroke-width="1" opacity="0.6">
          <line x1="0"   y1="50"  x2="350" y2="50"/>
          <line x1="0"   y1="100" x2="350" y2="100"/>
          <line x1="0"   y1="150" x2="350" y2="150"/>
          <line x1="70"  y1="0"   x2="70"  y2="200"/>
          <line x1="140" y1="0"   x2="140" y2="200"/>
          <line x1="210" y1="0"   x2="210" y2="200"/>
          <line x1="280" y1="0"   x2="280" y2="200"/>
