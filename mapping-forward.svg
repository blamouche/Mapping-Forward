    </g>
  </g>

  <!-- Edge vignettes -->
  <rect x="0"   y="0" width="70"  height="200" fill="url(#fade-l)"/>
  <rect x="630" y="0" width="70"  height="200" fill="url(#fade-r)"/>

  <!-- ===== TITLE ===== -->
  <g class="title-group">
    <rect class="border-box" x="198" y="30" width="304" height="100"
          fill="rgba(255,255,255,0.88)" stroke="#1a88dd" stroke-width="3"/>
    <rect class="border-box" x="202" y="34" width="296" height="92"
          fill="none" stroke="#1a88dd" stroke-width="1" opacity="0.35"/>
    <text class="title1" x="350" y="84"  text-anchor="middle" filter="url(#glow-blue)">MAPPING</text>
    <text class="title2" x="350" y="114" text-anchor="middle" filter="url(#glow-yellow)">FORWARD</text>
  </g>

</svg>
