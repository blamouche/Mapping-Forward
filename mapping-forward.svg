        <rect x="0" y="0" width="350" height="200" fill="#e8f4d0"/>
        <rect x="0"   y="130" width="55"  height="70"  fill="#b8ddf0"/>
        <rect x="290" y="110" width="60"  height="90"  fill="#b8ddf0"/>
        <rect x="30"  y="10"  width="90"  height="70"  fill="#c0d89e"/>
        <rect x="195" y="40"  width="80"  height="60"  fill="#c0d89e"/>
        <rect x="300" y="140" width="50"  height="40"  fill="#c0d89e"/>
        <rect x="120" y="85"  width="80"  height="55"  fill="#f0dfa0"/>
        <rect x="55"  y="150" width="50"  height="35"  fill="#f0dfa0"/>
        <g stroke="#c0ccb0" stroke-width="1" opacity="0.6">
          <line x1="0"   y1="50"  x2="350" y2="50"/>
          <line x1="0"   y1="100" x2="350" y2="100"/>
          <line x1="0"   y1="150" x2="350" y2="150"/>
          <line x1="70"  y1="0"   x2="70"  y2="200"/>
          <line x1="140" y1="0"   x2="140" y2="200"/>
          <line x1="210" y1="0"   x2="210" y2="200"/>
          <line x1="280" y1="0"   x2="280" y2="200"/>
        </g>
        <path d="M40,20 Q75,5 110,30 Q135,50 115,72 Q95,88 65,78 Q35,65 40,20Z"
              fill="none" stroke="#9dbf77" stroke-width="1.5" opacity="0.6"/>
        <path d="M200,45 Q238,25 268,55 Q288,80 260,100 Q232,115 207,96 Q185,76 200,45Z"
              fill="none" stroke="#9dbf77" stroke-width="1.5" opacity="0.6"/>
        <rect x="0" y="94" width="350" height="12" fill="#e8d060"/>
        <line x1="0" y1="94"  x2="350" y2="94"  stroke="#cc9900" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="106" x2="350" y2="106" stroke="#cc9900" stroke-width="1.5" opacity="0.6"/>
        <line x1="140" y1="0"  x2="200" y2="94"  stroke="#e8d060" stroke-width="7" opacity="0.75"/>
        <line x1="200" y1="106" x2="265" y2="200" stroke="#e8d060" stroke-width="7" opacity="0.75"/>
        <path d="M0,165 Q28,153 58,167 Q88,180 118,163 Q148,146 178,160 Q208,174 238,158 Q268,142 298,158 Q325,170 350,163"
              fill="none" stroke="#7abcdd" stroke-width="6" opacity="0.75"/>
        <path d="M0,165 Q28,153 58,167 Q88,180 118,163 Q148,146 178,160 Q208,174 238,158 Q268,142 298,158 Q325,170 350,163"
              fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
        <g fill="#4a8833">
          <rect x="32"  y="18" width="10" height="10"/>
          <rect x="52"  y="26" width="10" height="10"/>
          <rect x="22"  y="36" width="10" height="10"/>
          <rect x="88"  y="15" width="10" height="10"/>
          <rect x="108" y="28" width="10" height="10"/>
          <rect x="70"  y="32" width="10" height="10"/>
          <rect x="204" y="48" width="10" height="10"/>
          <rect x="224" y="36" width="10" height="10"/>
          <rect x="245" y="52" width="10" height="10"/>
          <rect x="262" y="28" width="10" height="10"/>
          <rect x="310" y="148" width="10" height="10"/>
          <rect x="328" y="136" width="10" height="10"/>
        </g>
        <g fill="#7a4a20" opacity="0.7">
          <rect x="35"  y="28" width="4" height="5"/>
          <rect x="55"  y="36" width="4" height="5"/>
          <rect x="25"  y="46" width="4" height="5"/>
          <rect x="91"  y="25" width="4" height="5"/>
          <rect x="111" y="38" width="4" height="5"/>
          <rect x="73"  y="42" width="4" height="5"/>
          <rect x="207" y="58" width="4" height="5"/>
          <rect x="227" y="46" width="4" height="5"/>
          <rect x="248" y="62" width="4" height="5"/>
          <rect x="265" y="38" width="4" height="5"/>
        </g>
        <rect x="145" y="108" width="14" height="20" fill="#aab0c4"/>
        <rect x="163" y="112" width="10" height="16" fill="#aab0c4"/>
        <rect x="177" y="106" width="16" height="22" fill="#aab0c4"/>
        <rect x="197" y="110" width="12" height="18" fill="#aab0c4"/>
        <rect x="147" y="103" width="10" height="6"  fill="#8890a0"/>
        <rect x="179" y="102" width="12" height="6"  fill="#8890a0"/>
        <g transform="translate(326, 26)" opacity="0.75">
          <polygon points="0,-13 -4,-4 0,-7 4,-4" fill="#cc2222"/>
          <polygon points="0,13 -4,4 0,7 4,4"   fill="#667788"/>
          <polygon points="13,0 4,-3 7,0 4,3"   fill="#667788"/>
          <polygon points="-13,0 -4,-3 -7,0 -4,3" fill="#667788"/>
          <circle cx="0" cy="0" r="3" fill="#334455"/>
        </g>
        <g class="pin-c" transform="translate(75, 138)">
          <rect x="-8" y="-24" width="16" height="16" rx="2" fill="#ee8800" filter="url(#drop-pin)"/>
          <rect x="-4" y="-20" width="8"  height="8"  fill="#ffcc66"/>
          <polygon points="-5,0 5,0 0,9" fill="#ee8800"/>
        </g>
        <g class="pin-a" transform="translate(168, 58)">
