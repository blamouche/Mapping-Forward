        <!-- Secondary road -->
        <line x1="140" y1="0"  x2="200" y2="94"  stroke="#e8d060" stroke-width="7" opacity="0.75"/>
        <line x1="200" y1="106" x2="265" y2="200" stroke="#e8d060" stroke-width="7" opacity="0.75"/>
        <!-- River -->
        <path d="M0,165 Q28,153 58,167 Q88,180 118,163 Q148,146 178,160 Q208,174 238,158 Q268,142 298,158 Q325,170 350,163"
              fill="none" stroke="#7abcdd" stroke-width="6" opacity="0.75"/>
        <path d="M0,165 Q28,153 58,167 Q88,180 118,163 Q148,146 178,160 Q208,174 238,158 Q268,142 298,158 Q325,170 350,163"
              fill="none" stroke="white" stroke-width="2" opacity="0.4"/>

        <!-- Pixel trees -->
        <g fill="#4a8833">
          <rect x="32"  y="18" width="10" height="10"/>
          <rect x="52"  y="26" width="10" height="10"/>
          <rect x="22"  y="36" width="10" height="10"/>
          <rect x="88"  y="15" width="10" height="10"/>
          <rect x="108" y="28" width="10" height="10"/>
          <rect x="70"  y="32" width="10" height="10"/>
          <rect x="204" y="48" width="10" height="10"/>
          <rect x="224" y="36" width="10" height="10"/>
          <rect x="245" y="52" width="10" height="10"/>
          <rect x="262" y="28" width="10" height="10"/>
          <rect x="310" y="148" width="10" height="10"/>
          <rect x="328" y="136" width="10" height="10"/>
        </g>
        <g fill="#7a4a20" opacity="0.7">
          <rect x="35"  y="28" width="4" height="5"/>
          <rect x="55"  y="36" width="4" height="5"/>
          <rect x="25"  y="46" width="4" height="5"/>
          <rect x="91"  y="25" width="4" height="5"/>
          <rect x="111" y="38" width="4" height="5"/>
          <rect x="73"  y="42" width="4" height="5"/>
          <rect x="207" y="58" width="4" height="5"/>
          <rect x="227" y="46" width="4" height="5"/>
          <rect x="248" y="62" width="4" height="5"/>
